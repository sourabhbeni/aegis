[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Web injection scanner — SQLi (error/boolean/time-based) and reflected XSS with WAF-evasion payload engines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Saurabh Beniwal" }]
keywords = ["security", "sqli", "xss", "pentest", "waf-bypass", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://github.com/sourabhbeni/aegis"

[tool.setuptools.packages.find]
include = ["aegis*"]
